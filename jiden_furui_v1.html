<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自伝 古 — Jiden Furui</title>
<style>
    /* --- COLOR PALETTE & VARIABLES --- */
    :root {
        --bg-color: #0d0a07;
        --surface-color: #1a1208;
        --canvas-bg: #2a1f0e;
        --text-primary: #c8a96e;
        --text-secondary: #7a6040;
        --accent: #4a7c6f;
        --accent-bright: #6db3a3;
        --lapis: #2a4a8a;
        --lapis-bright: #4a7abf;
        --blood: #8a3a2a;
        --bone: #e8d5b0;
        --border: #3a2a14;
        
        --ui-font: 'Courier New', Courier, monospace;
        --editor-font: Georgia, serif;
    }

    /* --- RESET & BASE --- */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border-radius: 0 !important; /* Ancient things have edges */
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--ui-font);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        letter-spacing: 0.05em;
        position: relative;
    }

    /* Subtle noise texture */
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 9999;
    }

    ::selection {
        background-color: var(--accent);
        color: var(--text-primary);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: var(--surface-color);
        border-left: 1px solid var(--border);
    }
    ::-webkit-scrollbar-thumb {
        background: var(--border);
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
    }

    /* --- LAYOUT --- */
    header {
        height: 48px;
        background-color: var(--surface-color);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        flex-shrink: 0;
        z-index: 10;
    }

    .main-workspace {
        flex: 1;
        display: flex;
        overflow: hidden;
        position: relative;
    }

    .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .divider {
        width: 1px;
        background-color: var(--border);
        z-index: 2;
    }

    .strata-bar {
        height: 80px;
        background-color: var(--surface-color);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 24px;
        flex-shrink: 0;
        position: relative;
        z-index: 10;
        overflow-x: auto;
    }

    /* --- TYPOGRAPHY & UI ELEMENTS --- */
    h1 {
        font-size: 16px;
        font-weight: normal;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text-primary);
    }

    .cuneiform {
        font-size: 20px;
        color: var(--accent);
    }

    button {
        background: none;
        border: 1px solid var(--border);
        color: var(--text-primary);
        font-family: var(--ui-font);
        font-size: 11px;
        padding: 6px 12px;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    button:hover {
        border-color: var(--accent-bright);
        color: var(--accent-bright);
    }

    button.active {
        background-color: var(--accent);
        color: var(--bg-color);
        border-color: var(--accent);
    }

    button.danger:hover {
        border-color: var(--blood);
        color: var(--blood);
    }

    .header-controls {
        display: flex;
        gap: 16px;
        align-items: center;
    }

    /* Inputs */
    .ancient-input {
        background: var(--bg-color);
        border: 1px solid var(--border);
        color: var(--text-primary);
        font-family: var(--ui-font);
        font-size: 11px;
        padding: 6px 8px;
        width: 180px;
        outline: none;
        letter-spacing: 0.05em;
        transition: border-color 0.3s;
    }
    
    .ancient-input:focus {
        border-color: var(--accent);
    }
    
    .ancient-input::placeholder {
        color: var(--text-secondary);
        font-style: italic;
    }

    /* Burden Indicator */
    #burden-indicator {
        color: var(--blood);
        font-size: 11px;
        cursor: help;
        font-weight: bold;
        display: none;
    }

    /* Seal Button Pulse */
    @keyframes sealPulse {
        0% { box-shadow: 0 0 0 0 rgba(74, 124, 111, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(74, 124, 111, 0); }
        100% { box-shadow: 0 0 0 0 rgba(74, 124, 111, 0); }
    }
    .btn-seal {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: bold;
    }
    .btn-seal:hover {
        background-color: var(--accent);
        color: var(--bg-color);
    }
    .btn-seal.pulsing {
        animation: sealPulse 0.5s ease-out;
        background-color: var(--accent);
        color: var(--bg-color);
    }

    /* Custom Dropdown for Rivers */
    .river-selector {
        position: relative;
    }
    .river-selector-btn {
        border: 1px solid var(--border);
        padding: 6px 12px;
        font-size: 11px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 160px;
        justify-content: space-between;
    }
    .river-dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        min-width: 220px;
        background-color: var(--surface-color);
        border: 1px solid var(--border);
        border-top: none;
        display: none;
        flex-direction: column;
        z-index: 20;
    }
    .river-selector:hover .river-dropdown,
    .river-dropdown.force-show {
        display: flex;
    }
    .river-option {
        padding: 8px 12px;
        font-size: 11px;
        cursor: pointer;
        color: var(--text-secondary);
        transition: color 0.3s, background 0.3s;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .river-option span {
        flex: 1;
    }
    .river-option:hover {
        color: var(--text-primary);
        background-color: var(--bg-color);
    }
    .river-option.active {
        color: var(--accent);
    }
    .river-option-new {
        border-top: 1px solid var(--border);
        color: var(--accent);
    }
    
    .btn-confluence {
        background: none;
        border: 1px solid var(--border);
        color: var(--accent);
        cursor: pointer;
        padding: 2px 6px;
        font-size: 9px;
        margin-left: 12px;
        opacity: 0.8;
    }
    .btn-confluence:hover {
        background: var(--accent);
        color: var(--bg-color);
        opacity: 1;
    }

    .unborn-mark {
        color: var(--accent);
        font-style: italic;
        font-size: 0.9em;
    }

    /* --- TEXT TABLET --- */
    .text-tablet {
        flex: 1;
        background-color: var(--bg-color);
        padding: 40px;
        overflow-y: auto;
        font-family: var(--editor-font);
        font-size: 16px;
        line-height: 1.6;
        color: var(--text-primary);
        outline: none;
        transition: opacity 0.4s ease-in-out;
    }
    
    .text-tablet[contenteditable="true"]:empty:before {
        content: "The tablet is unmarked. Begin.";
        color: var(--text-secondary);
        font-style: italic;
        pointer-events: none;
    }

    .shortcuts-hint {
        position: absolute;
        bottom: 12px;
        left: 40px;
        font-size: 10px;
        color: var(--text-secondary);
        opacity: 0.4;
        pointer-events: none;
        z-index: 10;
        line-height: 1.5;
    }

    /* --- DRAWING STONE --- */
    .drawing-stone {
        flex: 1;
        background-color: var(--canvas-bg);
        position: relative;
        overflow: hidden;
        transition: opacity 0.4s ease-in-out;
    }

    canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        cursor: crosshair;
    }

    .tools {
        position: absolute;
        top: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 5;
    }

    .tool-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        background-color: var(--surface-color);
        border: 1px solid var(--border);
        opacity: 0.8;
    }
    .tool-btn:hover {
        opacity: 1;
    }
    .tool-btn.active {
        border-color: var(--accent);
        color: var(--accent);
        opacity: 1;
    }

    .color-indicator {
        width: 12px; height: 12px;
        border: 1px solid var(--border);
    }

    .width-indicator {
        background-color: currentColor;
        border-radius: 50% !important; /* Exception for dots */
    }

    /* --- STRATA TIMELINE --- */
    .strata-container {
        display: flex;
        align-items: center;
        height: 100%;
        flex: 1;
        padding-left: 16px;
    }

    .seal-node {
        width: 8px;
        height: 16px;
        background-color: var(--lapis);
        cursor: pointer;
        position: relative;
        transition: all 0.3s ease-in-out;
        flex-shrink: 0;
    }
    .seal-node:hover {
        background-color: var(--lapis-bright);
        transform: scaleY(1.2);
    }
    .seal-node.active {
        background-color: var(--lapis-bright);
        height: 20px;
        box-shadow: 0 0 8px rgba(74, 122, 191, 0.5);
    }
    
    .seal-node.merge-node {
        background-color: var(--accent);
        transform: rotate(45deg);
        width: 12px;
        height: 12px;
        margin: 0 2px;
    }
    .seal-node.merge-node:hover {
        transform: rotate(45deg) scale(1.3);
    }
    .seal-node.merge-node.active {
        background-color: var(--accent-bright);
        transform: rotate(45deg) scale(1.5);
        box-shadow: 0 0 8px rgba(109, 179, 163, 0.5);
    }

    .seal-line {
        height: 1px;
        width: 30px;
        background-color: var(--lapis);
        flex-shrink: 0;
    }

    /* Tooltip */
    .seal-node::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background-color: var(--bg-color);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        padding: 8px;
        font-family: var(--ui-font);
        font-size: 10px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 100;
    }
    .seal-node:hover::after {
        opacity: 1;
    }
    .seal-node.merge-node::after {
        transform: translateX(-50%) rotate(-45deg); /* Counter rotate tooltip for merge nodes */
        transform-origin: bottom left;
    }

    .strata-actions {
        display: flex;
        gap: 12px;
        margin-left: auto;
        padding-left: 24px;
    }

    /* --- PALIMPSEST VIEW (DIFF) --- */
    .palimpsest-controls {
        display: none;
        gap: 12px;
        align-items: center;
        margin-left: 24px;
        color: var(--text-secondary);
        font-size: 11px;
    }
    .palimpsest-active .palimpsest-controls {
        display: flex;
    }
    .palimpsest-active .strata-container {
        display: none; /* Hide normal timeline when in diff mode */
    }

    select.ancient-select {
        background: var(--bg-color);
        color: var(--text-primary);
        border: 1px solid var(--border);
        font-family: var(--ui-font);
        padding: 4px 8px;
        outline: none;
    }

    .diff-add {
        color: var(--accent-bright);
        background-color: rgba(74, 124, 111, 0.1);
        text-decoration: none;
    }
    .diff-del {
        color: var(--blood);
        background-color: rgba(138, 58, 42, 0.1);
        text-decoration: line-through;
    }

    /* Status overlay */
    #status-msg {
        position: fixed;
        bottom: 90px;
        right: 24px;
        color: var(--accent);
        font-size: 11px;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        pointer-events: none;
        z-index: 50;
    }

    /* Restore overlay banner */
    .restore-banner {
        position: absolute;
        top: 0; left: 0; width: 100%;
        background-color: rgba(138, 58, 42, 0.9);
        color: var(--bone);
        font-size: 11px;
        text-align: center;
        padding: 4px;
        z-index: 100;
        display: none;
        letter-spacing: 0.1em;
    }
</style>
</head>
<body>

    <!-- THE STORE: Serialized history lives here -->
    <script id="jiden-store" type="application/json">
null
    </script>

    <header>
        <h1><span class="cuneiform">𒀭</span> 自伝 古</h1>
        
        <div class="header-controls">
            <span id="burden-indicator" title="Artifact is growing large. Consider archiving old rivers.">⚠</span>
            <input type="text" id="seal-inscription" class="ancient-input" placeholder="Describe this stratum..." maxlength="60" />
            
            <div class="river-selector" id="river-selector">
                <div class="river-selector-btn" id="current-river-btn">
                    <span>River: 𒆳main</span>
                    <span>▾</span>
                </div>
                <div class="river-dropdown" id="river-dropdown">
                    <!-- populated via js -->
                </div>
            </div>
            
            <button class="btn-seal" id="btn-seal" title="Seal current state and generate new artifact [Ctrl+S]">
                <span>⊕</span> Seal
            </button>
        </div>
    </header>

    <div class="restore-banner" id="restore-banner">VIEWING ANCIENT STRATUM. SEAL TO BRANCH.</div>

    <div class="main-workspace">
        <!-- TEXT TABLET -->
        <div class="panel">
            <div class="text-tablet" id="text-tablet" contenteditable="true" spellcheck="false"></div>
            <div class="shortcuts-hint">
                Ctrl+S : Seal Artifact<br>
                Ctrl+B : Bold Inscription<br>
                Ctrl+I : Italic Inscription
            </div>
        </div>

        <div class="divider"></div>

        <!-- DRAWING STONE -->
        <div class="panel drawing-stone">
            <canvas id="drawing-canvas"></canvas>
            
            <div class="tools" id="canvas-tools">
                <button class="tool-btn active" id="tool-draw" title="Draw">✏️</button>
                <button class="tool-btn" id="tool-erase" title="Erase">◻</button>
                <button class="tool-btn" id="tool-color" title="Change Pigment">
                    <div class="color-indicator" id="color-indicator" style="background-color: var(--text-primary)"></div>
                </button>
                <button class="tool-btn" id="tool-width" title="Stroke Width">
                    <div class="width-indicator" id="width-indicator" style="width: 4px; height: 4px;"></div>
                </button>
                <button class="tool-btn danger" id="tool-clear" title="Clear Stone">⟳</button>
            </div>
        </div>
    </div>

    <div class="strata-bar">
        <div class="strata-container" id="strata-timeline">
            <!-- Timeline nodes injected here -->
        </div>

        <div class="palimpsest-controls">
            <span>Palimpsest:</span>
            <select class="ancient-select" id="palimp-a"></select>
            <span>vs</span>
            <select class="ancient-select" id="palimp-b"></select>
        </div>

        <div class="strata-actions">
            <button id="btn-palimpsest" title="Compare Strata">⧖ Palimpsest</button>
            <button id="btn-transcribe" title="Export lineage to plain text">▤ Transcribe</button>
            <button id="btn-restore" title="Restore to current view" style="display:none;">↺ Resurrect</button>
        </div>
    </div>

    <div id="status-msg">Artifact sealed.</div>

<script>
/**
 * 自伝 古 — Jiden Furui
 * Engine Core
 */

// --- DATA MODEL ---
let store = {
    version: "1.0",
    rivers: { "𒆳main": null }, // branchName -> headSealId
    currentRiver: "𒆳main",
    seals: {}, // id -> { id, timestamp, message, textContent, strokes, parent, river, merge, mergeParents }
    HEAD: null // currently viewed seal id
};

// Application State
let isPalimpsest = false;
let isViewingHistory = false; // true if HEAD is not the river's latest

// Canvas State
let strokes = []; // Current active strokes
let currentStroke = null;
let isDrawing = false;
let canvas = document.getElementById('drawing-canvas');
let ctx = canvas.getContext('2d');

const colors = ['#c8a96e', '#4a7c6f', '#2a4a8a', '#e8d5b0', '#8a3a2a'];
let colorIndex = 0;
let strokeWidths = [2, 5, 10];
let widthIndex = 0;
let isEraser = false;

// DOM Elements
const textTablet = document.getElementById('text-tablet');
const sealInscription = document.getElementById('seal-inscription');
const burdenIndicator = document.getElementById('burden-indicator');
const riverBtnText = document.querySelector('#current-river-btn span');
const riverDropdown = document.getElementById('river-dropdown');
const strataTimeline = document.getElementById('strata-timeline');
const btnSeal = document.getElementById('btn-seal');
const btnPalimpsest = document.getElementById('btn-palimpsest');
const btnTranscribe = document.getElementById('btn-transcribe');
const btnRestore = document.getElementById('btn-restore');
const restoreBanner = document.getElementById('restore-banner');
const statusMsg = document.getElementById('status-msg');

// --- INITIALIZATION ---
function init() {
    const scriptTag = document.getElementById('jiden-store');
    const rawData = scriptTag.textContent.trim();
    
    if (rawData && rawData !== 'null') {
        try {
            store = JSON.parse(rawData);
            checkBurden(rawData.length);
        } catch (e) {
            console.error("Failed to read ancient text. Corruption detected.", e);
        }
    }

    if (store.HEAD && store.seals[store.HEAD]) {
        loadSealIntoView(store.HEAD);
    }

    setupCanvas();
    setupEventListeners();
    renderUI();
}

// --- CORE LOGIC ---

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
}

function showStatus(msg) {
    statusMsg.textContent = msg;
    statusMsg.style.opacity = 1;
    setTimeout(() => { statusMsg.style.opacity = 0; }, 3000);
}

function checkBurden(bytesStringLength = null) {
    const size = bytesStringLength || JSON.stringify(store).length;
    if (size > 500000) { // ~500kb
        const kb = Math.round(size / 1024);
        burdenIndicator.textContent = `⚠ ${kb}kb`;
        burdenIndicator.style.display = 'inline-block';
    } else {
        burdenIndicator.style.display = 'none';
    }
}

// Seal current state. Accepts overrides for merges.
function seal(customMsg = null, mergeParents = null) {
    // 1. Capture content
    const rawText = textTablet.innerHTML;
    const plainText = textTablet.innerText || "";
    
    let message = customMsg || sealInscription.value.trim();
    if (!message) {
        message = plainText.trim().substring(0, 40).replace(/\n/g, ' ');
        if (!message) message = "Silent seal";
    }

    // Create new seal
    const id = generateId();
    const newSeal = {
        id,
        timestamp: Date.now(),
        message,
        textContent: rawText,
        strokes: JSON.parse(JSON.stringify(strokes)), // deep copy
        parent: store.HEAD,
        river: store.currentRiver
    };

    if (mergeParents) {
        newSeal.merge = true;
        newSeal.mergeParents = mergeParents;
    }

    // Update Store
    store.seals[id] = newSeal;
    store.rivers[store.currentRiver] = id;
    store.HEAD = id;
    isViewingHistory = false;

    // 2. Serialize and Download Safely
    // Use JSON stringify with escaped script terminators to prevent corruption
    const storeStr = JSON.stringify(store, null, 2).replace(/<\//g, "<\\/");
    checkBurden(storeStr.length);

    // Deep clone the document so we can strip the live DOM data safely
    // without risking user data loss if an error occurs.
    const docClone = document.documentElement.cloneNode(true);
    
    // Clear editor to save file space (it's already safely in the store JSON)
    const clonedTablet = docClone.querySelector('#text-tablet');
    if (clonedTablet) clonedTablet.innerHTML = '';
    
    const clonedSealBtn = docClone.querySelector('#btn-seal');
    if (clonedSealBtn) clonedSealBtn.classList.remove('pulsing');
    
    // Inject the new serialized store
    const clonedStore = docClone.querySelector('#jiden-store');
    if (clonedStore) clonedStore.textContent = '\n' + storeStr + '\n';
    
    // Reconstruct valid HTML string
    let html = "<!DOCTYPE html>\n" + docClone.outerHTML;

    // Trigger download
    const blob = new Blob([html], { type: "text/html" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "jiden-furui.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // Clean up UI
    sealInscription.value = '';
    btnSeal.classList.add('pulsing');
    setTimeout(() => btnSeal.classList.remove('pulsing'), 500);
    showStatus("New artifact forged. Retain the downloaded file.");
    
    renderUI();
}

// Phase 2.4 - Confluence (Merge)
function confluence(otherRiver) {
    const otherHeadId = store.rivers[otherRiver];
    if (!otherHeadId || !store.seals[otherHeadId]) return;
    
    const otherSeal = store.seals[otherHeadId];
    
    // Override text with the other river's head
    textTablet.innerHTML = otherSeal.textContent;
    
    // Concatenate strokes
    const otherStrokes = JSON.parse(JSON.stringify(otherSeal.strokes || []));
    strokes = strokes.concat(otherStrokes);
    redrawCanvas();
    
    // Seal the merged state
    seal(`Confluence with ${otherRiver}`, [store.HEAD, otherHeadId]);
}

// Phase 2.2 - Transcribe Export
function transcribe() {
    const headId = store.rivers[store.currentRiver];
    if (!headId) return;

    const lineage = getLineage(headId);
    let output = `自伝 古 — Lineage Export\nRiver: ${store.currentRiver}\nGenerated: ${new Date().toLocaleString()}\n\n`;
    
    lineage.forEach((s, idx) => {
        output += `════════════════════════════════\n`;
        output += `[${idx + 1}] ${new Date(s.timestamp).toLocaleString()} — "${s.message}"\n`;
        output += `════════════════════════════════\n`;
        
        // Strip HTML
        const temp = document.createElement('div');
        temp.innerHTML = s.textContent;
        let plainText = temp.innerText || "";
        
        output += `${plainText.trim()}\n\n\n`;
    });
    
    const blob = new Blob([output], { type: "text/plain" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `jiden-transcribe-${store.currentRiver}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    showStatus("Transcription completed.");
}

function switchRiver(riverName) {
    if (!store.rivers.hasOwnProperty(riverName)) return;
    store.currentRiver = riverName;
    const headId = store.rivers[riverName];
    store.HEAD = headId;
    isViewingHistory = false;
    loadSealIntoView(headId);
    renderUI();
}

function createRiver() {
    const name = prompt("Name the new river:", "𒆳branch-" + Math.floor(Math.random()*1000));
    if (!name) return;
    if (store.rivers[name]) {
        alert("River already exists.");
        return;
    }
    // Branch from current HEAD
    store.rivers[name] = store.HEAD;
    store.currentRiver = name;
    renderUI();
    showStatus(`River ${name} formed.`);
}

function loadSealIntoView(sealId) {
    if (!sealId || !store.seals[sealId]) {
        textTablet.innerHTML = "";
        strokes = [];
    } else {
        const s = store.seals[sealId];
        textTablet.innerHTML = s.textContent;
        strokes = JSON.parse(JSON.stringify(s.strokes || []));
        store.HEAD = sealId;
        
        // Check if we are viewing an old seal
        const riverHead = store.rivers[store.currentRiver];
        isViewingHistory = (sealId !== riverHead);
    }
    
    redrawCanvas();
    updateViewingState();
}

function updateViewingState() {
    if (isViewingHistory) {
        restoreBanner.style.display = 'block';
        textTablet.style.opacity = '0.8';
        canvas.style.opacity = '0.8';
        btnRestore.style.display = 'flex';
    } else {
        restoreBanner.style.display = 'none';
        textTablet.style.opacity = '1';
        canvas.style.opacity = '1';
        btnRestore.style.display = 'none';
    }
}

function resurrect() {
    // Make the currently viewed historical seal the new HEAD of the river
    if (!isViewingHistory) return;
    seal("Resurrected ancient stratum"); 
}

// --- RENDERING UI ---

function renderUI() {
    // Render River Dropdown
    const currentHeadId = store.rivers[store.currentRiver];
    const currentIsUnborn = currentHeadId && store.seals[currentHeadId] && store.seals[currentHeadId].river !== store.currentRiver;
    
    riverBtnText.innerHTML = `River: ${store.currentRiver} ${currentIsUnborn ? '<span class="unborn-mark">(unborn)</span>' : ''}`;
    riverDropdown.innerHTML = '';
    
    Object.keys(store.rivers).forEach(r => {
        const headId = store.rivers[r];
        const isUnborn = headId && store.seals[headId] && store.seals[headId].river !== r;
        
        const div = document.createElement('div');
        div.className = `river-option ${r === store.currentRiver ? 'active' : ''}`;
        
        const nameSpan = document.createElement('span');
        nameSpan.innerHTML = `${r} ${isUnborn ? '<span class="unborn-mark">(unborn)</span>' : ''}`;
        nameSpan.onclick = (e) => {
            e.stopPropagation();
            switchRiver(r);
        };
        div.appendChild(nameSpan);

        if (r !== store.currentRiver) {
            const confBtn = document.createElement('button');
            confBtn.className = 'btn-confluence';
            confBtn.textContent = '⋈ Confluence';
            confBtn.title = `Merge ${r} into ${store.currentRiver}`;
            confBtn.onclick = (e) => {
                e.stopPropagation();
                if(confirm(`Create confluence with ${r}?\nThis pulls its text and strokes into the current river.`)) {
                    confluence(r);
                }
            };
            div.appendChild(confBtn);
        }

        riverDropdown.appendChild(div);
    });

    const newBtn = document.createElement('div');
    newBtn.className = 'river-option river-option-new';
    newBtn.innerHTML = '<span>+ New River</span>';
    newBtn.onclick = createRiver;
    riverDropdown.appendChild(newBtn);

    renderStrata();
    
    if (isPalimpsest) {
        populatePalimpsestSelects();
    }
}

function getLineage(headId) {
    const lineage = [];
    let curr = headId;
    while (curr && store.seals[curr]) {
        lineage.unshift(store.seals[curr]); // Older seals at the front
        curr = store.seals[curr].parent;
    }
    return lineage;
}

function renderStrata() {
    strataTimeline.innerHTML = '';
    const riverHead = store.rivers[store.currentRiver];
    if (!riverHead) return;

    const lineage = getLineage(riverHead);
    
    lineage.forEach((s, index) => {
        const node = document.createElement('div');
        node.className = `seal-node ${s.id === store.HEAD ? 'active' : ''}`;
        if (s.merge) node.classList.add('merge-node');
        
        const dateStr = new Date(s.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        node.setAttribute('data-tooltip', `[${dateStr}] ${s.message}`);
        
        node.onclick = () => {
            if (isPalimpsest) return;
            // Visual transition
            textTablet.style.opacity = 0;
            canvas.style.opacity = 0;
            setTimeout(() => {
                loadSealIntoView(s.id);
                renderStrata(); // re-render to update active class
                textTablet.style.opacity = isViewingHistory ? 0.8 : 1;
                canvas.style.opacity = isViewingHistory ? 0.8 : 1;
            }, 300);
        };

        strataTimeline.appendChild(node);

        if (index < lineage.length - 1) {
            const line = document.createElement('div');
            line.className = 'seal-line';
            strataTimeline.appendChild(line);
        }
    });
    
    // Auto scroll to right
    setTimeout(() => {
        strataTimeline.parentElement.scrollLeft = strataTimeline.parentElement.scrollWidth;
    }, 50);
}

// --- PALIMPSEST (DIFF ENGINE) ---

function togglePalimpsest() {
    isPalimpsest = !isPalimpsest;
    document.body.classList.toggle('palimpsest-active', isPalimpsest);
    btnPalimpsest.classList.toggle('active', isPalimpsest);
    
    if (isPalimpsest) {
        textTablet.setAttribute('contenteditable', 'false');
        populatePalimpsestSelects();
        renderPalimpsest();
    } else {
        textTablet.setAttribute('contenteditable', 'true');
        loadSealIntoView(store.HEAD); // Restore normal view
    }
}

function populatePalimpsestSelects() {
    const selA = document.getElementById('palimp-a');
    const selB = document.getElementById('palimp-b');
    selA.innerHTML = ''; selB.innerHTML = '';
    
    const lineage = getLineage(store.rivers[store.currentRiver]);
    // Reverse for dropdown (newest first)
    lineage.reverse().forEach(s => {
        const dateStr = new Date(s.timestamp).toLocaleTimeString();
        const optText = `${dateStr} - ${s.message.substring(0,15)}...`;
        selA.add(new Option(optText, s.id));
        selB.add(new Option(optText, s.id));
    });

    if (lineage.length >= 2) {
        selA.value = lineage[1].id; // older
        selB.value = lineage[0].id; // newer
    }

    selA.onchange = renderPalimpsest;
    selB.onchange = renderPalimpsest;
}

function simpleDiff(oldHtml, newHtml) {
    const tempA = document.createElement('div'); tempA.innerHTML = oldHtml || "";
    const tempB = document.createElement('div'); tempB.innerHTML = newHtml || "";
    
    const wordsA = (tempA.innerText || "").split(/\s+/).filter(Boolean);
    const wordsB = (tempB.innerText || "").split(/\s+/).filter(Boolean);
    
    let resultHTML = "";
    let i = 0, j = 0;
    
    while (i < wordsA.length || j < wordsB.length) {
        if (wordsA[i] === wordsB[j]) {
            resultHTML += wordsA[i] + " ";
            i++; j++;
        } else {
            let foundInB = wordsB.indexOf(wordsA[i], j);
            let foundInA = wordsA.indexOf(wordsB[j], i);
            
            if (foundInB !== -1 && (foundInA === -1 || foundInB - j < foundInA - i)) {
                while (j < foundInB) {
                    resultHTML += `<span class="diff-add">${wordsB[j]}</span> `;
                    j++;
                }
            } else if (foundInA !== -1) {
                while (i < foundInA) {
                    resultHTML += `<span class="diff-del">${wordsA[i]}</span> `;
                    i++;
                }
            } else {
                if (i < wordsA.length) resultHTML += `<span class="diff-del">${wordsA[i]}</span> `;
                if (j < wordsB.length) resultHTML += `<span class="diff-add">${wordsB[j]}</span> `;
                i++; j++;
            }
        }
    }
    
    return resultHTML.replace(/\n/g, '<br>');
}

function renderPalimpsest() {
    const idA = document.getElementById('palimp-a').value;
    const idB = document.getElementById('palimp-b').value;
    if (!idA || !idB) return;

    const sealA = store.seals[idA];
    const sealB = store.seals[idB];

    // Text Diff
    textTablet.innerHTML = simpleDiff(sealA.textContent, sealB.textContent);

    // Canvas Diff (Ghosting)
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw A (Ghosted)
    ctx.globalAlpha = 0.15;
    drawStrokesRaw(sealA.strokes || []);
    
    // Draw B (Normal)
    ctx.globalAlpha = 1.0;
    drawStrokesRaw(sealB.strokes || []);
}


// --- CANVAS LOGIC ---

function setupCanvas() {
    const resizeObserver = new ResizeObserver(() => {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        redrawCanvas();
    });
    resizeObserver.observe(canvas.parentElement);

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseout', endDraw);
    
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e.touches[0]); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); }, {passive: false});
    canvas.addEventListener('touchend', endDraw);
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) / rect.width,
        y: (e.clientY - rect.top) / rect.height
    };
}

function startDraw(e) {
    if (isPalimpsest || isViewingHistory) return;
    isDrawing = true;
    const pos = getPos(e);
    currentStroke = {
        color: isEraser ? 'erase' : colors[colorIndex],
        width: strokeWidths[widthIndex],
        points: [pos]
    };
    strokes.push(currentStroke);
}

function draw(e) {
    if (!isDrawing || isPalimpsest || isViewingHistory) return;
    const pos = getPos(e);
    currentStroke.points.push(pos);
    redrawCanvas();
}

function endDraw() {
    isDrawing = false;
    currentStroke = null;
}

function redrawCanvas() {
    if (!canvas.width || !canvas.height) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    drawStrokesRaw(strokes);
}

function drawStrokesRaw(strokeArray) {
    strokeArray.forEach(strk => {
        if (!strk.points || strk.points.length < 1) return;
        
        ctx.beginPath();
        if (strk.color === 'erase') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = strk.width * 3;
            ctx.strokeStyle = '#000';
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.lineWidth = strk.width;
            ctx.strokeStyle = strk.color;
        }

        const first = strk.points[0];
        ctx.moveTo(first.x * canvas.width, first.y * canvas.height);
        
        for (let i = 1; i < strk.points.length; i++) {
            const p = strk.points[i];
            ctx.lineTo(p.x * canvas.width, p.y * canvas.height);
        }
        ctx.stroke();
    });
    ctx.globalCompositeOperation = 'source-over';
}

// --- TOOLBAR & EVENTS ---
function setupEventListeners() {
    btnSeal.addEventListener('click', () => seal());
    btnPalimpsest.addEventListener('click', togglePalimpsest);
    btnTranscribe.addEventListener('click', transcribe);
    btnRestore.addEventListener('click', resurrect);

    // Global Shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey) {
            if (e.key === 's') {
                e.preventDefault();
                seal();
            }
        }
    });

    // Editor-specific behavior blocks
    textTablet.addEventListener('keydown', (e) => {
        if (isPalimpsest || isViewingHistory) {
            e.preventDefault();
            return;
        }
        // Let native browser handle basic formatting (Ctrl+B, Ctrl+I)
    });
    
    // Inscription Submit
    sealInscription.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            seal();
        }
    });

    // Drawing Tools
    const tDraw = document.getElementById('tool-draw');
    const tErase = document.getElementById('tool-erase');
    const tColor = document.getElementById('tool-color');
    const tWidth = document.getElementById('tool-width');
    const tClear = document.getElementById('tool-clear');
    const cInd = document.getElementById('color-indicator');
    const wInd = document.getElementById('width-indicator');

    function resetTools() {
        tDraw.classList.remove('active');
        tErase.classList.remove('active');
    }

    tDraw.onclick = () => { resetTools(); tDraw.classList.add('active'); isEraser = false; };
    tErase.onclick = () => { resetTools(); tErase.classList.add('active'); isEraser = true; };
    
    tColor.onclick = () => {
        colorIndex = (colorIndex + 1) % colors.length;
        cInd.style.backgroundColor = colors[colorIndex];
        if (isEraser) tDraw.click();
    };

    tWidth.onclick = () => {
        widthIndex = (widthIndex + 1) % strokeWidths.length;
        wInd.style.width = strokeWidths[widthIndex] * 2 + 'px';
        wInd.style.height = strokeWidths[widthIndex] * 2 + 'px';
    };

    tClear.onclick = () => {
        if (isPalimpsest || isViewingHistory) return;
        if (confirm("Erase the stone completely?")) {
            strokes = [];
            redrawCanvas();
        }
    };
}

// Boot
init();

</script>
